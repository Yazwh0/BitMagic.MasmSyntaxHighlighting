name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.3 (a matching tag is created)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Unit tests
        run: dotnet test tests/MasmSyntaxHighlight.Tests/MasmSyntaxHighlight.Tests.csproj -c Release

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'
          if (-not $v) { $v = '${{ github.ref_name }}' -replace '^v', '' }
          if ($v -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw "Version '$v' is not N.N.N[.N]" }

          # The repo carries a 9999.0.0 dev sentinel (see README > Cutting a release). A real
          # release must be a plausible low version - never the sentinel, never a typo like
          # '99999'. Raise the ceiling here if the project ever legitimately reaches major 100.
          $major = [int]($v -split '\.')[0]
          if ($major -ge 100) {
            throw "Refusing to release version '$v': major $major is out of range (dev sentinel is 9999.0.0). Tag a real version such as 1.2.3."
          }

          $v4 = if (($v -split '\.').Count -eq 4) { $v } else { "$v.0" }
          "version=$v"   >> $env:GITHUB_OUTPUT
          "version4=$v4" >> $env:GITHUB_OUTPUT
          "tag=v$v"      >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $v (assembly $v4)"

      - name: Stamp version into manifest and AssemblyInfo
        shell: pwsh
        run: |
          $manifest = 'src/MasmSyntaxHighlight/source.extension.vsixmanifest'
          $xml = Get-Content $manifest -Raw
          $xml = [regex]::Replace($xml, '(<Identity\b[^>]*\bVersion=")[^"]*(")', '${1}${{ steps.ver.outputs.version }}${2}')
          Set-Content $manifest $xml -NoNewline

          $asm = 'src/MasmSyntaxHighlight/Properties/AssemblyInfo.cs'
          $cs = Get-Content $asm -Raw
          $cs = [regex]::Replace($cs, '(AssemblyVersion\(")[^"]*("\))',     '${1}${{ steps.ver.outputs.version4 }}${2}')
          $cs = [regex]::Replace($cs, '(AssemblyFileVersion\(")[^"]*("\))', '${1}${{ steps.ver.outputs.version4 }}${2}')
          Set-Content $asm $cs -NoNewline

          Write-Host "manifest = ${{ steps.ver.outputs.version }} ; assembly = ${{ steps.ver.outputs.version4 }}"

      - name: Verify stamped version
        shell: pwsh
        run: |
          $want  = '${{ steps.ver.outputs.version }}'
          $want4 = '${{ steps.ver.outputs.version4 }}'

          $manifest = Get-Content 'src/MasmSyntaxHighlight/source.extension.vsixmanifest' -Raw
          if ($manifest -notmatch '<Identity\b[^>]*\bVersion="([^"]+)"') { throw 'No <Identity Version> found in the manifest.' }
          $gotManifest = $Matches[1]

          $asm = Get-Content 'src/MasmSyntaxHighlight/Properties/AssemblyInfo.cs' -Raw
          if ($asm -notmatch 'AssemblyVersion\("([^"]+)"\)') { throw 'No AssemblyVersion found in AssemblyInfo.cs.' }
          $gotAsm = $Matches[1]

          # The stamp step must have replaced the dev sentinel with the resolved version. If a
          # manifest/format change ever makes the regex silently no-op, this stops the release
          # before 9999.0.0 (or any wrong version) can be built and published.
          if ($gotManifest -ne $want)  { throw "Manifest version is '$gotManifest', expected '$want' - the stamp step did not take." }
          if ($gotAsm      -ne $want4) { throw "AssemblyVersion is '$gotAsm', expected '$want4' - the stamp step did not take." }
          if ($gotManifest -match '^\d{3,}\.' -or $gotAsm -match '^\d{3,}\.') { throw "Refusing to release version '$gotManifest' - looks like the dev sentinel." }

          Write-Host "Verified: manifest $gotManifest, assembly $gotAsm"

      - name: Restore NuGet packages
        run: msbuild MasmSyntaxHighlight.sln -t:Restore -p:Configuration=Release

      - name: Build VSIX
        run: msbuild MasmSyntaxHighlight.sln -t:Build -p:Configuration=Release -p:DeployExtension=false

      - name: Locate VSIX
        id: vsix
        shell: pwsh
        run: |
          $f = Get-ChildItem 'src/MasmSyntaxHighlight/bin/Release/*.vsix' | Select-Object -First 1
          if (-not $f) { throw 'No .vsix produced' }
          $out = "MasmSyntaxHighlight-$('${{ steps.ver.outputs.version }}').vsix"
          Copy-Item $f.FullName $out
          "path=$out" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: ${{ steps.vsix.outputs.path }}
          generate_release_notes: true

      # ---- Visual Studio Marketplace -----------------------------------------------
      # Runs only when the repository secret VS_MARKETPLACE_PAT is set (an Azure DevOps
      # PAT with the Marketplace > Manage scope for all accessible organizations).
      # Uses vs-publish.json + marketplace-overview.md at the repo root.
      - name: Check for Marketplace token
        id: pat
        shell: bash
        run: |
          if [ -n "${{ secrets.VS_MARKETPLACE_PAT }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VS_MARKETPLACE_PAT not set - skipping Marketplace publish."
          fi

      - name: Publish to Visual Studio Marketplace
        if: steps.pat.outputs.present == 'true'
        shell: pwsh
        env:
          VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          # VsixPublisher.exe ships inside the Microsoft.VSSDK.BuildTools NuGet package that
          # the project already restores - the hosted runner does not have it in the VS install.
          $nugetRoot = if ($env:NUGET_PACKAGES) { $env:NUGET_PACKAGES } else { Join-Path $env:USERPROFILE '.nuget/packages' }
          $exe = Get-ChildItem (Join-Path $nugetRoot 'microsoft.vssdk.buildtools') -Recurse -Filter 'VsixPublisher.exe' -ErrorAction SilentlyContinue |
                 Sort-Object FullName -Descending | Select-Object -First 1 | ForEach-Object FullName
          if (-not $exe) { throw 'VsixPublisher.exe not found under the NuGet cache - did the Restore step run?' }

          Write-Host "Using $exe"
          & $exe publish `
            -payload         '${{ steps.vsix.outputs.path }}' `
            -publishManifest 'vs-publish.json' `
            -personalAccessToken $env:VS_MARKETPLACE_PAT `
            -ignoreWarnings 'VSIXValidatorWarning01,VSIXValidatorWarning02'
          if ($LASTEXITCODE -ne 0) { throw "VsixPublisher exited with $LASTEXITCODE" }
