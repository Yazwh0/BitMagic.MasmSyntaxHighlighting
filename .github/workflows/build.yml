name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: msbuild MasmSyntaxHighlight.sln -t:Restore -p:Configuration=Release

      - name: Build VSIX
        run: msbuild MasmSyntaxHighlight.sln -t:Build -p:Configuration=Release -p:DeployExtension=false

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasmSyntaxHighlight-vsix
          path: src/MasmSyntaxHighlight/bin/Release/*.vsix
          if-no-files-found: error
